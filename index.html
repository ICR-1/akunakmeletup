    <style>
      /* Layar memuat: gaya sebaris agar tampil seketika sebelum skrip dan stylesheet game termuat.
         Tema: persiapan peluncuran. Bintang mengalir, cakrawala Bumi, dan bilah progres sederhana. */
      #loading {
        position: fixed; inset: 0; z-index: 1000; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        padding: 24px 16px 18vh;
        background: radial-gradient(ellipse 90% 70% at 50% 30%, #1a2152 0%, #0b0e26 55%, #05060f 100%);
        color: #f8fafc; text-align: center;
        font-family: 'Quicksand', 'Nunito', 'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Rounded MT Bold', sans-serif;
        transition: opacity 0.5s ease 0.15s;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading > * { position: relative; }
      /* Tiga lapis bintang dengan kecepatan berbeda (paralaks), mengalir ke bawah. */
      #loading .loading-stars, #loading .loading-stars::before, #loading .loading-stars::after {
        position: absolute; inset: -50% 0 0; content: '';
        background-image:
          radial-gradient(1.2px 1.2px at 20px 30px, #fff 60%, transparent),
          radial-gradient(1px 1px at 120px 80px, #c7d2fe 60%, transparent),
          radial-gradient(1.4px 1.4px at 70px 160px, #fff 60%, transparent),
          radial-gradient(1px 1px at 170px 190px, #bae6fd 60%, transparent);
        background-size: 200px 220px;
        animation: loading-stars 9s linear infinite; opacity: 0.55;
      }
      #loading .loading-stars { position: absolute; }
      #loading .loading-stars::before { inset: 0; background-size: 320px 300px; animation-duration: 5s; opacity: 0.8; }
      #loading .loading-stars::after { inset: 0; background-size: 470px 410px; animation-duration: 3s; opacity: 0.9; filter: drop-shadow(0 0 2px #fff); }
      @keyframes loading-stars { to { background-position-y: 440px; } }
      /* Cakrawala Bumi dengan pendar atmosfer di bawah layar. */
      #loading .loading-planet {
        position: absolute; left: 50%; top: calc(100% - 15vh); width: 180vmax; height: 180vmax; margin-left: -90vmax;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 0%, #2563eb 0%, #1e3a8a 6%, #0b1437 16%, #050816 40%);
        box-shadow: 0 0 40px 6px rgba(56, 189, 248, 0.55), 0 0 140px 30px rgba(99, 102, 241, 0.35), inset 0 10px 30px rgba(125, 211, 252, 0.55);
        animation: loading-planet 12s ease-in-out infinite alternate;
      }
      @keyframes loading-planet { to { transform: translateY(1.5vh); } }
      #loading .loading-kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; color: #7dd3fc; text-shadow: 0 1px 3px #000; }
      #loading .loading-title { margin: 0; width: min(560px, 90vw); }
      /* Cadangan sebelum skrip (logo SVG menggantikannya begitu skrip termuat). */
      #loading .loading-wordmark { display: block; padding: 24px 0 14px; font-size: 72px; font-weight: 900; letter-spacing: 0.12em; color: #7dd3fc; -webkit-text-stroke: 3px #0b1437; text-shadow: 0 6px 0 #3730a3, 0 0 30px rgba(56, 189, 248, 0.5); }
      #loading .title-logo { width: 100%; }
      #loading .loading-sub { margin-top: -6px; padding: 5px 24px; font-size: 13px; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; color: #e0f2fe; border-top: 1px solid rgba(125, 211, 252, 0.35); border-bottom: 1px solid rgba(125, 211, 252, 0.35); background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.22), transparent); }
      /* Bilah progres sederhana. */
      #loading .loading-track {
        width: min(520px, 80vw); height: 8px; margin-top: 30px; border-radius: 999px; overflow: hidden;
        background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(125, 211, 252, 0.3);
      }
      #loading .loading-fill {
        height: 100%; width: 0%; border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #7dd3fc);
        box-shadow: 0 0 10px rgba(125, 211, 252, 0.6); transition: width 0.25s ease-out;
      }
      #loading .loading-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; width: min(520px, 80vw); margin-top: 6px; }
      #loading .loading-step { min-height: 1.4em; font-size: 13px; font-weight: 700; color: #bae6fd; text-align: left; text-shadow: 0 1px 3px #000; }
      #loading .loading-pct { font-size: 22px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #3730a3, 0 0 12px rgba(56, 189, 248, 0.6); }
      @media (max-width: 520px) { #loading .loading-kicker-extra { display: none; } #loading .loading-wordmark { font-size: 52px; } #loading .loading-sub { letter-spacing: 0.2em; font-size: 11px; } }
      @media (prefers-reduced-motion: reduce) { #loading *, #loading *::before, #loading *::after { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-stars" aria-hidden="true"></div>
      <div class="loading-planet" aria-hidden="true"></div>
      <div class="loading-kicker">Badan Antariksa Khatulistiwa<span class="loading-kicker-extra"> · Pusat Kendali Misi</span></div>
      <h1 class="loading-title"><span class="loading-wordmark">ASTRA</span></h1>
      <div class="loading-sub">Space Mission Architect</div>
      <div class="loading-track">
        <div class="loading-fill"></div>
      </div>
      <div class="loading-meta"><span class="loading-step">Menyiapkan semua bahan misi sebelum peluncuran</span><span class="loading-pct">0%</span></div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="scene-fade"></div>
    <div id="overlay">
      <div id="scene-label"></div>
      <div id="scene-hint"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
